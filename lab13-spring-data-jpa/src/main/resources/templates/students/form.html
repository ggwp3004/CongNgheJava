<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${student.id} != null ? 'Sua sinh vien' : 'Them sinh vien'"></title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-group { margin-bottom: 12px; }
        label { display: inline-block; width: 120px; font-weight: bold; }
        input[type=text], input[type=email] { padding: 6px; width: 260px; }
        .btn { padding: 6px 16px; border: none; border-radius: 4px; color: white; cursor: pointer; }
        .btn-save { background-color: #27ae60; }
        .btn-back { background-color: #7f8c8d; text-decoration: none; padding: 6px 16px; border-radius: 4px; color: white; }
    </style>
</head>
<body>

<h1 th:text="${student.id} != null ? 'Sua thong tin sinh vien' : 'Them sinh vien moi'"></h1>

<form th:action="@{/students/save}" th:object="${student}" method="post">
    <!-- Giu lai id khi sua, de bo trong khi them moi -->
    <input type="hidden" th:field="*{id}"/>

    <div class="form-group">
        <label>Ma sinh vien</label>
        <input type="text" th:field="*{studentCode}" required="required"/>
    </div>

    <div class="form-group">
        <label>Ho ten</label>
        <input type="text" th:field="*{fullName}" required="required"/>
    </div>

    <div class="form-group">
        <label>Email</label>
        <input type="email" th:field="*{email}"/>
    </div>

    <div class="form-group">
        <label>Lop</label>
        <input type="text" th:field="*{className}"/>
    </div>

    <button type="submit" class="btn btn-save">Luu</button>
    <a class="btn-back" th:href="@{/students}">Quay lai</a>
</form>

</body>
</html>
