<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sach sinh vien</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
        th { background-color: #2c3e50; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .btn { padding: 4px 10px; text-decoration: none; border-radius: 4px; color: white; margin-right: 4px; }
        .btn-add { background-color: #27ae60; }
        .btn-edit { background-color: #2980b9; }
        .btn-delete { background-color: #c0392b; }
        .search-box { margin-bottom: 20px; }
        .search-box input[type=text] { padding: 6px; width: 250px; }
        .search-box button { padding: 6px 14px; }
    </style>
</head>
<body>

<h1>Danh sach sinh vien</h1>

<a class="btn btn-add" th:href="@{/students/create}">+ Them sinh vien</a>

<div class="search-box">
    <form th:action="@{/students}" method="get">
        <input type="text" name="keyword" placeholder="Tim theo ho ten..." th:value="${keyword}"/>
        <button type="submit">Tim kiem</button>
    </form>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Ma SV</th>
        <th>Ho ten</th>
        <th>Email</th>
        <th>Lop</th>
        <th>Hanh dong</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="sv : ${students}">
        <td th:text="${sv.id}"></td>
        <td th:text="${sv.studentCode}"></td>
        <td th:text="${sv.fullName}"></td>
        <td th:text="${sv.email}"></td>
        <td th:text="${sv.className}"></td>
        <td>
            <a class="btn btn-edit" th:href="@{/students/edit/{id}(id=${sv.id})}">Sua</a>
            <a class="btn btn-delete" th:href="@{/students/delete/{id}(id=${sv.id})}"
               onclick="return confirm('Ban co chac muon xoa sinh vien nay?');">Xoa</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
